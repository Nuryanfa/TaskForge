# SLO burn demo override (docs/SLO.md):
#   docker compose -f compose.yaml -f compose.demo.yaml up -d --build
# One slow worker and demo-speed alert windows make the start-latency budget
# burn visibly within minutes. Not for production.
services:
  taskforge-worker:
    environment:
      TASKFORGE_WORKER_CONCURRENCY: "1"

  prometheus:
    command:
      - --config.file=/etc/prometheus/demo/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./deployments/prometheus/demo:/etc/prometheus/demo:ro
