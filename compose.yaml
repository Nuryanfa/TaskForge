services:
  postgres:
    # Migrations are not executed automatically by the current scaffold.
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: taskforge
      POSTGRES_USER: taskforge
      POSTGRES_PASSWORD: taskforge
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskforge -d taskforge"]
      interval: 2s
      timeout: 2s
      retries: 20
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - taskforge-postgres:/var/lib/postgresql/data

  taskforge:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile
    environment:
      TASKFORGE_HTTP_ADDR: :8080
      TASKFORGE_DATABASE_URL: postgres://taskforge:taskforge@postgres:5432/taskforge?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  taskforge-postgres:
