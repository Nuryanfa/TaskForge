services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: taskforge
      POSTGRES_USER: taskforge
      POSTGRES_PASSWORD: taskforge
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskforge -d taskforge"]
      interval: 2s
      timeout: 2s
      retries: 20
    ports:
      - "127.0.0.1:${TASKFORGE_POSTGRES_PORT:-5432}:5432"
    volumes:
      - taskforge-postgres:/var/lib/postgresql

  nats:
    image: nats:2.15.1-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null 'http://127.0.0.1:8222/healthz?js-enabled-only=true'"]
      interval: 2s
      timeout: 2s
      retries: 20
    ports:
      - "127.0.0.1:${TASKFORGE_NATS_PORT:-4222}:4222"
    volumes:
      - taskforge-nats:/data

  migrate:
    image: taskforge:dev
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile
    command: ["/taskforge-migrate"]
    environment:
      TASKFORGE_DATABASE_URL: postgres://taskforge:taskforge@postgres:5432/taskforge?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  taskforge-api:
    image: taskforge:dev
    pull_policy: never
    command: ["/taskforge-api"]
    environment:
      TASKFORGE_HTTP_ADDR: :8080
      TASKFORGE_DATABASE_URL: postgres://taskforge:taskforge@postgres:5432/taskforge?sslmode=disable
      TASKFORGE_JOB_MAX_ATTEMPTS: ${TASKFORGE_JOB_MAX_ATTEMPTS:-3}
      TASKFORGE_RETRY_INITIAL_BACKOFF: ${TASKFORGE_RETRY_INITIAL_BACKOFF:-1s}
      TASKFORGE_RETRY_MAX_BACKOFF: ${TASKFORGE_RETRY_MAX_BACKOFF:-60s}
      TASKFORGE_RETRY_JITTER_PERCENT: ${TASKFORGE_RETRY_JITTER_PERCENT:-20}
      TASKFORGE_DEAD_LETTER_PAGE_SIZE: ${TASKFORGE_DEAD_LETTER_PAGE_SIZE:-50}
      TASKFORGE_WORKFLOW_MAX_STEPS: ${TASKFORGE_WORKFLOW_MAX_STEPS:-32}
      TASKFORGE_WORKFLOW_MAX_BYTES: ${TASKFORGE_WORKFLOW_MAX_BYTES:-262144}
      TASKFORGE_WORKFLOW_PAGE_SIZE: ${TASKFORGE_WORKFLOW_PAGE_SIZE:-50}
      TASKFORGE_OTEL_ENDPOINT: ${TASKFORGE_OTEL_ENDPOINT:-http://jaeger:4318}
      TASKFORGE_OTEL_SAMPLE_RATIO: ${TASKFORGE_OTEL_SAMPLE_RATIO:-1}
      TASKFORGE_METRICS_ADDR: ":9101"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/taskforge-api", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:8080:8080"

  taskforge-worker:
    image: taskforge:dev
    pull_policy: never
    command: ["/taskforge-worker"]
    environment:
      TASKFORGE_DATABASE_URL: postgres://taskforge:taskforge@postgres:5432/taskforge?sslmode=disable
      TASKFORGE_WORKER_ID: compose-worker-1
      TASKFORGE_WORKER_CONCURRENCY: ${TASKFORGE_WORKER_CONCURRENCY:-4}
      TASKFORGE_JOB_LEASE_DURATION: ${TASKFORGE_JOB_LEASE_DURATION:-30s}
      TASKFORGE_JOB_HEARTBEAT_INTERVAL: ${TASKFORGE_JOB_HEARTBEAT_INTERVAL:-10s}
      TASKFORGE_RECOVERY_INTERVAL: ${TASKFORGE_RECOVERY_INTERVAL:-5s}
      TASKFORGE_RECOVERY_BATCH_SIZE: ${TASKFORGE_RECOVERY_BATCH_SIZE:-100}
      TASKFORGE_SCHEDULE_INTERVAL: ${TASKFORGE_SCHEDULE_INTERVAL:-1s}
      TASKFORGE_SCHEDULE_BATCH_SIZE: ${TASKFORGE_SCHEDULE_BATCH_SIZE:-50}
      TASKFORGE_JOB_MAX_ATTEMPTS: ${TASKFORGE_JOB_MAX_ATTEMPTS:-3}
      TASKFORGE_RETRY_INITIAL_BACKOFF: ${TASKFORGE_RETRY_INITIAL_BACKOFF:-1s}
      TASKFORGE_RETRY_MAX_BACKOFF: ${TASKFORGE_RETRY_MAX_BACKOFF:-60s}
      TASKFORGE_RETRY_JITTER_PERCENT: ${TASKFORGE_RETRY_JITTER_PERCENT:-20}
      TASKFORGE_NATS_URL: nats://nats:4222
      TASKFORGE_OTEL_ENDPOINT: ${TASKFORGE_OTEL_ENDPOINT:-http://jaeger:4318}
      TASKFORGE_OTEL_SAMPLE_RATIO: ${TASKFORGE_OTEL_SAMPLE_RATIO:-1}
      TASKFORGE_METRICS_ADDR: ":9102"
    depends_on:
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy

  taskforge-relay:
    image: taskforge:dev
    pull_policy: never
    command: ["/taskforge-relay"]
    environment:
      TASKFORGE_DATABASE_URL: postgres://taskforge:taskforge@postgres:5432/taskforge?sslmode=disable
      TASKFORGE_NATS_URL: nats://nats:4222
      TASKFORGE_NATS_STREAM: ${TASKFORGE_NATS_STREAM:-TASKFORGE_EVENTS}
      TASKFORGE_NATS_STREAM_MAX_AGE: ${TASKFORGE_NATS_STREAM_MAX_AGE:-168h}
      TASKFORGE_OUTBOX_POLL_INTERVAL: ${TASKFORGE_OUTBOX_POLL_INTERVAL:-200ms}
      TASKFORGE_OUTBOX_BATCH_SIZE: ${TASKFORGE_OUTBOX_BATCH_SIZE:-100}
      TASKFORGE_OUTBOX_RETENTION: ${TASKFORGE_OUTBOX_RETENTION:-24h}
      TASKFORGE_OTEL_ENDPOINT: ${TASKFORGE_OTEL_ENDPOINT:-http://jaeger:4318}
      TASKFORGE_OTEL_SAMPLE_RATIO: ${TASKFORGE_OTEL_SAMPLE_RATIO:-1}
      TASKFORGE_METRICS_ADDR: ":9103"
    depends_on:
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy

  # Observability stack (v0.7). All UIs bind to loopback only.
  jaeger:
    image: jaegertracing/all-in-one:1.71.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:${TASKFORGE_JAEGER_PORT:-16686}:16686"

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./deployments/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deployments/prometheus/rules:/etc/prometheus/rules:ro
      - taskforge-prometheus:/prometheus
    ports:
      - "127.0.0.1:${TASKFORGE_PROMETHEUS_PORT:-9090}:9090"

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/taskforge.json
    volumes:
      - ./deployments/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deployments/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - jaeger
    ports:
      - "127.0.0.1:${TASKFORGE_GRAFANA_PORT:-3000}:3000"

volumes:
  taskforge-postgres:
  taskforge-nats:
  taskforge-prometheus:
