services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: taskforge
      POSTGRES_USER: taskforge
      POSTGRES_PASSWORD: taskforge
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskforge -d taskforge"]
      interval: 2s
      timeout: 2s
      retries: 20
    ports:
      - "127.0.0.1:${TASKFORGE_POSTGRES_PORT:-5432}:5432"
    volumes:
      - taskforge-postgres:/var/lib/postgresql

  migrate:
    image: taskforge:dev
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile
    command: ["/taskforge-migrate"]
    environment:
      TASKFORGE_DATABASE_URL: postgres://taskforge:taskforge@postgres:5432/taskforge?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  taskforge-api:
    image: taskforge:dev
    pull_policy: never
    command: ["/taskforge-api"]
    environment:
      TASKFORGE_HTTP_ADDR: :8080
      TASKFORGE_DATABASE_URL: postgres://taskforge:taskforge@postgres:5432/taskforge?sslmode=disable
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/taskforge-api", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:8080:8080"

  taskforge-worker:
    image: taskforge:dev
    pull_policy: never
    command: ["/taskforge-worker"]
    environment:
      TASKFORGE_DATABASE_URL: postgres://taskforge:taskforge@postgres:5432/taskforge?sslmode=disable
      TASKFORGE_WORKER_ID: compose-worker-1
      TASKFORGE_WORKER_CONCURRENCY: ${TASKFORGE_WORKER_CONCURRENCY:-4}
      TASKFORGE_JOB_LEASE_DURATION: ${TASKFORGE_JOB_LEASE_DURATION:-30s}
      TASKFORGE_JOB_HEARTBEAT_INTERVAL: ${TASKFORGE_JOB_HEARTBEAT_INTERVAL:-10s}
      TASKFORGE_RECOVERY_INTERVAL: ${TASKFORGE_RECOVERY_INTERVAL:-5s}
      TASKFORGE_RECOVERY_BATCH_SIZE: ${TASKFORGE_RECOVERY_BATCH_SIZE:-100}
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  taskforge-postgres:
