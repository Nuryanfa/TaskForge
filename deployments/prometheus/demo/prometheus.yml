# Demo-only Prometheus config (compose.demo.yaml): faster scrapes and an extra
# rule file whose burn windows are scaled down so an alert fires in minutes.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml
  - /etc/prometheus/demo/slo-demo.yml

scrape_configs:
  - job_name: taskforge-api
    static_configs:
      - targets: ["taskforge-api:9101"]
  - job_name: taskforge-worker
    static_configs:
      - targets: ["taskforge-worker:9102"]
  - job_name: taskforge-relay
    static_configs:
      - targets: ["taskforge-relay:9103"]
