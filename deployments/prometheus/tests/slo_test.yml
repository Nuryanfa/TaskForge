# promtool test rules /p/tests/slo_test.yml  (run from deployments/prometheus)
rule_files:
  - ../rules/slo.yml

evaluation_interval: 1m

tests:
  # 20 % of claims start later than 5 s at 600 claims/hour: burns the 1 % budget
  # far faster than 14.4x, so the page-level alert fires.
  - interval: 1m
    input_series:
      - series: 'taskforge_job_start_delay_seconds_count{queue="default",kind="demo.echo"}'
        values: '0+10x120'
      - series: 'taskforge_job_start_delay_seconds_bucket{queue="default",kind="demo.echo",le="5.0"}'
        values: '0+8x120'
    alert_rule_test:
      - eval_time: 75m
        alertname: TaskForgeStartLatencyFastBurn
        exp_alerts:
          - exp_labels:
              severity: page
              slo: start_latency
            exp_annotations:
              summary: Jobs are starting later than 5 seconds after becoming ready, burning the error budget fast.

  # 0.5 % slow starts is within the 1 % budget: silent.
  - interval: 1m
    input_series:
      - series: 'taskforge_job_start_delay_seconds_count{queue="default",kind="demo.echo"}'
        values: '0+10x420'
      - series: 'taskforge_job_start_delay_seconds_bucket{queue="default",kind="demo.echo",le="5.0"}'
        values: '0+9.95x420'
    alert_rule_test:
      - eval_time: 75m
        alertname: TaskForgeStartLatencyFastBurn
        exp_alerts: []
      - eval_time: 400m
        alertname: TaskForgeStartLatencySlowBurn
        exp_alerts: []

  # Every claim is late, but only 6 claims/hour: below the minimum volume of
  # 20 events/hour, so neither alert fires on so little evidence.
  - interval: 1m
    input_series:
      - series: 'taskforge_job_start_delay_seconds_count{queue="default",kind="demo.echo"}'
        values: '0+0.1x420'
      - series: 'taskforge_job_start_delay_seconds_bucket{queue="default",kind="demo.echo",le="5.0"}'
        values: '0x420'
    alert_rule_test:
      - eval_time: 75m
        alertname: TaskForgeStartLatencyFastBurn
        exp_alerts: []
      - eval_time: 400m
        alertname: TaskForgeStartLatencySlowBurn
        exp_alerts: []

  # 8 % slow starts over 6 hours: above 6x but below 14.4x, so only the
  # ticket-level slow-burn alert fires.
  - interval: 1m
    input_series:
      - series: 'taskforge_job_start_delay_seconds_count{queue="default",kind="demo.echo"}'
        values: '0+10x420'
      - series: 'taskforge_job_start_delay_seconds_bucket{queue="default",kind="demo.echo",le="5.0"}'
        values: '0+9.2x420'
    alert_rule_test:
      - eval_time: 400m
        alertname: TaskForgeStartLatencyFastBurn
        exp_alerts: []
      - eval_time: 400m
        alertname: TaskForgeStartLatencySlowBurn
        exp_alerts:
          - exp_labels:
              severity: ticket
              slo: start_latency
            exp_annotations:
              summary: Jobs are starting later than 5 seconds after becoming ready, burning the error budget steadily.

  # Platform dead letters (lease expiry) burn the reliability budget.
  - interval: 1m
    input_series:
      - series: 'taskforge_job_outcomes_total{kind="demo.echo",outcome="succeeded",class="none"}'
        values: '0+10x120'
      - series: 'taskforge_job_outcomes_total{kind="demo.echo",outcome="dead_lettered",class="platform"}'
        values: '0+2x120'
    alert_rule_test:
      - eval_time: 75m
        alertname: TaskForgeReliabilityFastBurn
        exp_alerts:
          - exp_labels:
              severity: page
              slo: reliability
            exp_annotations:
              summary: Jobs are being dead-lettered by platform failures, burning the error budget fast.

  # Handler failures (demo.fail) never burn the platform reliability budget.
  - interval: 1m
    input_series:
      - series: 'taskforge_job_outcomes_total{kind="demo.echo",outcome="succeeded",class="none"}'
        values: '0+10x420'
      - series: 'taskforge_job_outcomes_total{kind="demo.fail",outcome="dead_lettered",class="handler"}'
        values: '0+50x420'
    alert_rule_test:
      - eval_time: 75m
        alertname: TaskForgeReliabilityFastBurn
        exp_alerts: []
      - eval_time: 400m
        alertname: TaskForgeReliabilitySlowBurn
        exp_alerts: []

  # No worker claims anything (no start-delay samples at all) while ready jobs
  # age: the stall alert still fires.
  - interval: 1m
    input_series:
      - series: 'taskforge_oldest_ready_job_age_seconds{instance="api:9101",job="taskforge-api"}'
        values: '0+60x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: TaskForgeJobsNotStarting
        exp_alerts:
          - exp_labels:
              severity: page
            exp_annotations:
              summary: Ready jobs have waited more than 60 seconds; workers are down or cannot keep up.

  # The database collector (API process) stopped reporting.
  - interval: 1m
    input_series:
      - series: 'up{job="taskforge-worker",instance="worker:9102"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: TaskForgeDBCollectorAbsent
        exp_alerts:
          - exp_labels:
              severity: page
            exp_annotations:
              summary: Database-state metrics are missing; the API or its database connection is down.

  # A scrape target is down.
  - interval: 1m
    input_series:
      - series: 'up{job="taskforge-worker",instance="worker:9102"}'
        values: '0x10'
      - series: 'taskforge_jobs{state="ready",instance="api:9101",job="taskforge-api"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: TaskForgeTargetDown
        exp_alerts:
          - exp_labels:
              severity: page
              job: taskforge-worker
              instance: worker:9102
            exp_annotations:
              summary: A TaskForge process is not being scraped.
      - eval_time: 5m
        alertname: TaskForgeDBCollectorAbsent
        exp_alerts: []

  # About 5.7 % platform dead letters over 6 hours: above 6x the 0.5 % budget
  # but below 14.4x, so only the ticket-level reliability alert fires.
  - interval: 1m
    input_series:
      - series: 'taskforge_job_outcomes_total{kind="demo.echo",outcome="succeeded",class="none"}'
        values: '0+10x420'
      - series: 'taskforge_job_outcomes_total{kind="demo.echo",outcome="dead_lettered",class="platform"}'
        values: '0+0.6x420'
    alert_rule_test:
      - eval_time: 400m
        alertname: TaskForgeReliabilityFastBurn
        exp_alerts: []
      - eval_time: 400m
        alertname: TaskForgeReliabilitySlowBurn
        exp_alerts:
          - exp_labels:
              severity: ticket
              slo: reliability
            exp_annotations:
              summary: Jobs are being dead-lettered by platform failures, burning the error budget steadily.

  # 0.3 % platform dead letters is within the 0.5 % budget: both silent.
  - interval: 1m
    input_series:
      - series: 'taskforge_job_outcomes_total{kind="demo.echo",outcome="succeeded",class="none"}'
        values: '0+10x420'
      - series: 'taskforge_job_outcomes_total{kind="demo.echo",outcome="dead_lettered",class="platform"}'
        values: '0+0.03x420'
    alert_rule_test:
      - eval_time: 75m
        alertname: TaskForgeReliabilityFastBurn
        exp_alerts: []
      - eval_time: 400m
        alertname: TaskForgeReliabilitySlowBurn
        exp_alerts: []

  # A five-minute spike of platform dead letters (about 13 % over 5m) after an
  # hour of clean traffic: the 1h window stays near 1.2 %, below 14.4x, so the
  # page stays silent. Both windows must agree before anyone is paged.
  - interval: 1m
    input_series:
      - series: 'taskforge_job_outcomes_total{kind="demo.echo",outcome="succeeded",class="none"}'
        values: '0+10x80'
      - series: 'taskforge_job_outcomes_total{kind="demo.echo",outcome="dead_lettered",class="platform"}'
        values: '0x70 1.5+1.5x10'
    alert_rule_test:
      - eval_time: 75m
        alertname: TaskForgeReliabilityFastBurn
        exp_alerts: []

  # Every outcome is a platform dead letter, but only 6 per hour: below the
  # minimum volume, so neither reliability alert fires.
  - interval: 1m
    input_series:
      - series: 'taskforge_job_outcomes_total{kind="demo.echo",outcome="dead_lettered",class="platform"}'
        values: '0+0.1x420'
    alert_rule_test:
      - eval_time: 75m
        alertname: TaskForgeReliabilityFastBurn
        exp_alerts: []
      - eval_time: 400m
        alertname: TaskForgeReliabilitySlowBurn
        exp_alerts: []

  # Ready jobs that wait less than 60 seconds are normal queueing: silent.
  - interval: 1m
    input_series:
      - series: 'taskforge_oldest_ready_job_age_seconds{instance="api:9101",job="taskforge-api"}'
        values: '30x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: TaskForgeJobsNotStarting
        exp_alerts: []

  # Every target up and database gauges present: silent.
  - interval: 1m
    input_series:
      - series: 'up{job="taskforge-worker",instance="worker:9102"}'
        values: '1x10'
      - series: 'taskforge_jobs{state="ready",instance="api:9101",job="taskforge-api"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: TaskForgeTargetDown
        exp_alerts: []
      - eval_time: 6m
        alertname: TaskForgeDBCollectorAbsent
        exp_alerts: []

  # API availability (99.9 %): 10 % of requests fail with 500 at 600/hour,
  # far above 14.4x the 0.1 % budget, so the page fires.
  - interval: 1m
    input_series:
      - series: 'taskforge_http_requests_total{route="POST /v1/jobs",code="201"}'
        values: '0+9x120'
      - series: 'taskforge_http_requests_total{route="POST /v1/jobs",code="500"}'
        values: '0+1x120'
    alert_rule_test:
      - eval_time: 75m
        alertname: TaskForgeAPIAvailabilityFastBurn
        exp_alerts:
          - exp_labels:
              severity: page
              slo: api_availability
            exp_annotations:
              summary: API requests are failing with 5xx, burning the availability error budget fast.

  # About 0.8 % 5xx over 6 hours: above 6x but below 14.4x the budget, so only
  # the ticket-level slow burn fires.
  - interval: 1m
    input_series:
      - series: 'taskforge_http_requests_total{route="POST /v1/jobs",code="201"}'
        values: '0+10x420'
      - series: 'taskforge_http_requests_total{route="POST /v1/jobs",code="500"}'
        values: '0+0.08x420'
    alert_rule_test:
      - eval_time: 400m
        alertname: TaskForgeAPIAvailabilityFastBurn
        exp_alerts: []
      - eval_time: 400m
        alertname: TaskForgeAPIAvailabilitySlowBurn
        exp_alerts:
          - exp_labels:
              severity: ticket
              slo: api_availability
            exp_annotations:
              summary: API requests are failing with 5xx, burning the availability error budget steadily.

  # 0.05 % 5xx is within the 0.1 % budget: both silent.
  - interval: 1m
    input_series:
      - series: 'taskforge_http_requests_total{route="POST /v1/jobs",code="201"}'
        values: '0+10x420'
      - series: 'taskforge_http_requests_total{route="POST /v1/jobs",code="500"}'
        values: '0+0.005x420'
    alert_rule_test:
      - eval_time: 75m
        alertname: TaskForgeAPIAvailabilityFastBurn
        exp_alerts: []
      - eval_time: 400m
        alertname: TaskForgeAPIAvailabilitySlowBurn
        exp_alerts: []

  # Every request fails, but only 6 per hour: below the minimum volume.
  - interval: 1m
    input_series:
      - series: 'taskforge_http_requests_total{route="POST /v1/jobs",code="500"}'
        values: '0+0.1x420'
    alert_rule_test:
      - eval_time: 75m
        alertname: TaskForgeAPIAvailabilityFastBurn
        exp_alerts: []
      - eval_time: 400m
        alertname: TaskForgeAPIAvailabilitySlowBurn
        exp_alerts: []

  # A flood of client errors (400, 409, 422) never burns the platform budget.
  - interval: 1m
    input_series:
      - series: 'taskforge_http_requests_total{route="POST /v1/jobs",code="201"}'
        values: '0+10x420'
      - series: 'taskforge_http_requests_total{route="POST /v1/jobs",code="400"}'
        values: '0+5x420'
      - series: 'taskforge_http_requests_total{route="POST /v1/jobs",code="409"}'
        values: '0+5x420'
      - series: 'taskforge_http_requests_total{route="POST /v1/jobs",code="422"}'
        values: '0+5x420'
    alert_rule_test:
      - eval_time: 75m
        alertname: TaskForgeAPIAvailabilityFastBurn
        exp_alerts: []
      - eval_time: 400m
        alertname: TaskForgeAPIAvailabilitySlowBurn
        exp_alerts: []

  # Requests that matched no route, even 5xx, are not API availability events.
  - interval: 1m
    input_series:
      - series: 'taskforge_http_requests_total{route="POST /v1/jobs",code="201"}'
        values: '0+10x420'
      - series: 'taskforge_http_requests_total{route="unmatched",code="500"}'
        values: '0+5x420'
      - series: 'taskforge_http_requests_total{route="unmatched",code="404"}'
        values: '0+5x420'
    alert_rule_test:
      - eval_time: 75m
        alertname: TaskForgeAPIAvailabilityFastBurn
        exp_alerts: []
      - eval_time: 400m
        alertname: TaskForgeAPIAvailabilitySlowBurn
        exp_alerts: []

  # Probes do not dilute the SLI: 10 % 5xx still pages under 1000 probes/min,
  # which would push the ratio near 0.1 % if probes counted.
  - interval: 1m
    input_series:
      - series: 'taskforge_http_requests_total{route="POST /v1/jobs",code="201"}'
        values: '0+9x120'
      - series: 'taskforge_http_requests_total{route="POST /v1/jobs",code="500"}'
        values: '0+1x120'
      - series: 'taskforge_http_requests_total{route="GET /healthz",code="200"}'
        values: '0+1000x120'
    alert_rule_test:
      - eval_time: 75m
        alertname: TaskForgeAPIAvailabilityFastBurn
        exp_alerts:
          - exp_labels:
              severity: page
              slo: api_availability
            exp_annotations:
              summary: API requests are failing with 5xx, burning the availability error budget fast.

  # A five-minute 5xx spike (about 13 % over 5m) after an hour of clean
  # traffic: the 1h window stays near 1.2 %, below 14.4x the budget, so the
  # page stays silent until both windows agree.
  - interval: 1m
    input_series:
      - series: 'taskforge_http_requests_total{route="POST /v1/jobs",code="201"}'
        values: '0+10x80'
      - series: 'taskforge_http_requests_total{route="POST /v1/jobs",code="500"}'
        values: '0x70 1.5+1.5x10'
    alert_rule_test:
      - eval_time: 75m
        alertname: TaskForgeAPIAvailabilityFastBurn
        exp_alerts: []

  # The 28-day ratios behind the dashboard's error-budget panel (three hours
  # of data is enough: rate over [28d] uses whatever the window holds).
  - interval: 1m
    input_series:
      - series: 'taskforge_http_requests_total{route="POST /v1/jobs",code="201"}'
        values: '0+1x180'
      - series: 'taskforge_http_requests_total{route="POST /v1/jobs",code="500"}'
        values: '0+1x180'
      - series: 'taskforge_job_outcomes_total{kind="demo.echo",outcome="succeeded",class="none"}'
        values: '0+3x180'
      - series: 'taskforge_job_outcomes_total{kind="demo.echo",outcome="dead_lettered",class="platform"}'
        values: '0+1x180'
      - series: 'taskforge_job_outcomes_total{kind="demo.fail",outcome="dead_lettered",class="handler"}'
        values: '0+4x180'
      - series: 'taskforge_job_start_delay_seconds_count{queue="default",kind="demo.echo"}'
        values: '0+8x180'
      - series: 'taskforge_job_start_delay_seconds_bucket{queue="default",kind="demo.echo",le="5.0"}'
        values: '0+7x180'
    promql_expr_test:
      - expr: round(taskforge:api_availability_bad:ratio_rate28d, 0.0001)
        eval_time: 180m
        exp_samples:
          - value: 0.5
      - expr: round(taskforge:reliability_bad:ratio_rate28d, 0.0001)
        eval_time: 180m
        exp_samples:
          - value: 0.125
      - expr: round(taskforge:start_latency_bad:ratio_rate28d, 0.0001)
        eval_time: 180m
        exp_samples:
          - value: 0.125
