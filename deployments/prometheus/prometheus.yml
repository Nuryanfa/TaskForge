global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: taskforge-api
    static_configs:
      - targets: ["taskforge-api:9101"]
  - job_name: taskforge-worker
    static_configs:
      - targets: ["taskforge-worker:9102"]
  - job_name: taskforge-relay
    static_configs:
      - targets: ["taskforge-relay:9103"]
